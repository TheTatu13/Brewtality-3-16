name: Oportunitati SI Cariere

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          
      - name: Sync with remote
        if: github.event_name != 'pull_request'
        run: git pull origin main --rebase -X theirs

      - name: Install dependencies
        run: npm install

      - name: Ensure company exists in company core
        run: |
          CIF=$(jq -r '.id' scraper/config/company.json)
          LEGAL_NAME=$(jq -r '.company' scraper/config/company.json)
          BRAND=$(jq -r '.brand' scraper/config/company.json)
          WEBSITE=$(jq -r '.website[0]' scraper/config/company.json)
          CAREER=$(jq -r '.career[0]' scraper/config/company.json)
          DEFAULT_LOC=$(jq -r '.location[0]' scraper/config/company.json)
          SCRAPER_FILE=$(jq -r '.scraperFile' scraper/config/company.json)
          TODAY=$(date -u +%Y-%m-%d)

          echo "Upserting ${BRAND} (CIF: ${CIF}) via peviitor API..."
          jq -n \
            --arg id "$CIF" \
            --arg company "$LEGAL_NAME" \
            --arg brand "$BRAND" \
            --arg website "$WEBSITE" \
            --arg career "$CAREER" \
            --arg loc "$DEFAULT_LOC" \
            --arg today "$TODAY" \
            --arg scraperFile "$SCRAPER_FILE" \
            '{id:$id,company:$company,brand:$brand,status:"activ",location:[$loc],website:[$website],career:[$career],lastScraped:$today,scraperFile:$scraperFile}' \
            > company_data.json

          curl -s -X PUT \
            "https://api.peviitor.ro/v1/firme/company/add/" \
            -H "Content-Type: application/json" \
            --data-binary @company_data.json

          FINAL=$(curl -s \
            "https://api.peviitor.ro/v1/firme/company/?cif=${CIF}" | jq '.total')

          echo "${BRAND} count after upsert: $FINAL"

          if [ "$FINAL" -ge "1" ]; then
            echo "✅ SUCCESS: ${BRAND} is in company core"
          else
            echo "❌ FAILED: ${BRAND} still not in company core"
            exit 1
          fi

      - name: Pre-scrape — Unit Tests
        run: |
          mkdir -p docs/test-results
          npm run test:unit
          sed -i 's|<title>Test Report</title>|<title>Pre-scrape: Unit Tests — ANTIBIOTICE SA</title>|;s|<h1 id="title">Test Report</h1>|<h1 id="title">Pre-scrape: Unit Tests — ANTIBIOTICE SA</h1>|' test-report.html
          cp test-report.html docs/test-results/pre-scrape-unit.html || true

      - name: Pre-scrape — Integration Tests
        run: |
          mkdir -p docs/test-results
          npm run test:integration
          sed -i 's|<title>Test Report</title>|<title>Pre-scrape: Integration Tests — ANTIBIOTICE SA</title>|;s|<h1 id="title">Test Report</h1>|<h1 id="title">Pre-scrape: Integration Tests — ANTIBIOTICE SA</h1>|' test-report.html
          cp test-report.html docs/test-results/pre-scrape-integration.html || true

      - name: Run scraper
        run: npm run scrape
          
      - name: Check for new jobs
        run: |
          if [ -f scraper/jobs.json ]; then
            echo "New jobs found:"
            cat scraper/jobs.json | jq '.jobs | length'
          else
            echo "No new jobs or scrape failed"
          fi

      - name: Post-scrape — E2E Tests
        run: |
          mkdir -p docs/test-results
          npm run test:e2e
          sed -i 's|<title>Test Report</title>|<title>Post-scrape: E2E Tests — ANTIBIOTICE SA</title>|;s|<h1 id="title">Test Report</h1>|<h1 id="title">Post-scrape: E2E Tests — ANTIBIOTICE SA</h1>|' test-report.html
          cp test-report.html docs/test-results/post-scrape.html || true

      - name: Consistency Tests
        run: |
          mkdir -p docs/test-results
          npm run test:consistency
          sed -i 's|<title>Test Report</title>|<title>Post-scrape: Consistency Tests — ANTIBIOTICE SA</title>|;s|<h1 id="title">Test Report</h1>|<h1 id="title">Post-scrape: Consistency Tests — ANTIBIOTICE SA</h1>|' test-report.html
          cp test-report.html docs/test-results/post-scrape-consistency.html || true
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: docs/test-results/
          retention-days: 30

      - name: Push test results to docs/
        if: always()
        run: |
          mkdir -p docs/test-results
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/test-results/ || true
          git add docs/jobs.md || true
          git commit -m "[skip ci] Update test results" || echo "No changes to commit"
          git push || echo "Push failed (race condition) — will be picked up next run"
          
      - name: Upload jobs JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scraped-jobs
          path: |
            scraper/jobs.json
            scraper/jobs_existing.json
          retention-days: 7

  autoheal:
    runs-on: ubuntu-latest
    needs: scrape
    if: failure()
    permissions:
      issues: write

    steps:
      - name: Open (or update) an auto-heal issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create "auto-heal" --color "d73a4a" \
            --description "Automated failure of a scheduled workflow" 2>/dev/null || true

          # De-dup: one open auto-heal issue for this workflow at a time.
          EXISTING=$(gh issue list --label auto-heal --state open \
            --search "Auto-heal: scrape workflow in:title" \
            --json number --jq '.[0].number // empty')

          NOW=$(date -u +%FT%TZ)

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Another run failed: ${RUN_URL} (${NOW}, trigger: ${{ github.event_name }})."
            echo "Commented on existing issue #${EXISTING}"
            exit 0
          fi

          BODY="The **${{ github.workflow }}** workflow failed.

          - **Run:** ${RUN_URL}
          - **Commit:** \`${{ github.sha }}\`
          - **Trigger:** ${{ github.event_name }}
          - **When:** ${NOW}

          ## Likely causes
          - Careers-page selector broke — the scraper's canary aborts when all
            sources return 0 jobs (\`scraper/config/scraper.json\` selectors).
          - \`api.peviitor.ro\` / ANAF unreachable (retries with backoff are in
            place, but a long outage still fails the run).
          - Company marked inactive in ANAF (scraper deletes our jobs and stops).
          - A pre/post-scrape test suite failed.

          ## To fix
          1. Open the run logs above, find the failed step.
          2. Push a fix on \`main\`.
          3. Close this issue — the next scheduled run re-checks."

          gh issue create \
            --title "Auto-heal: scrape workflow failed $(date -u +%Y-%m-%d)" \
            --label auto-heal \
            --body "$BODY"